<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ESAI Premium Redesign</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --panel: oklch(98% 0.003 250);
      --soft: oklch(96% 0.004 250);
      --fg: oklch(18% 0.012 250);
      --muted: oklch(54% 0.012 250);
      --border: oklch(92% 0.005 250);
      --accent: oklch(58% 0.16 160);
      --accent-soft: oklch(58% 0.16 160 / 0.1);
      --accent-border: oklch(84% 0.08 155);
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }

    body[data-theme="dark"] {
      --bg: oklch(17% 0.012 250);
      --surface: oklch(22% 0.012 250);
      --panel: oklch(19% 0.011 250);
      --soft: oklch(25% 0.013 250);
      --fg: oklch(95% 0.004 250);
      --muted: oklch(70% 0.012 250);
      --border: oklch(31% 0.014 250);
      --accent: oklch(72% 0.14 160);
      --accent-soft: oklch(72% 0.14 160 / 0.16);
      --accent-border: oklch(58% 0.1 155);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; }
    button { font: inherit; }

    .glass {
      background: rgb(255 255 255 / 0.78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    body[data-theme="dark"] .glass { background: oklch(20% 0.012 250 / 0.78); }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-radius: 8px;
      font-weight: 650;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: oklch(86% 0.012 250);
      box-shadow: 0 18px 36px -24px rgb(0 0 0 / 0.22);
    }
    body[data-theme="dark"] .card:hover {
      border-color: oklch(45% 0.03 250);
      box-shadow: 0 22px 44px -28px rgb(0 0 0 / 0.72);
    }
    .sidebar-item {
      border-radius: 8px;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .sidebar-item:hover { background: rgb(0 0 0 / 0.045); }
    .sidebar-item.active { background: var(--accent-soft); color: var(--accent); }
    body[data-theme="dark"] .sidebar-item:hover { background: rgb(255 255 255 / 0.055); }
    .ratio-card {
      aspect-ratio: 1080 / 1350;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }
    .poster {
      min-height: 0;
      background:
        radial-gradient(circle at 22% 18%, var(--accent-soft), transparent 30%),
        linear-gradient(155deg, oklch(98% 0.004 250), oklch(94% 0.018 190));
      position: relative;
      overflow: hidden;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgb(255 255 255 / 0.76);
      border-radius: 18px;
    }
    .poster::after {
      content: "";
      position: absolute;
      right: -34px;
      bottom: -42px;
      width: 180px;
      height: 180px;
      border-radius: 999px;
      background: var(--accent-soft);
    }
    body[data-theme="dark"] .poster {
      background:
        radial-gradient(circle at 22% 18%, var(--accent-soft), transparent 32%),
        linear-gradient(155deg, oklch(28% 0.018 250), oklch(20% 0.03 190));
    }
    .stage-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--bg);
      position: relative;
      z-index: 2;
    }
    .stage-dot.active, .stage-dot.completed {
      border-color: var(--accent);
      background: var(--accent);
    }
    .stage-dot.active { box-shadow: 0 0 0 4px var(--accent-soft); }
    .resize-handle {
      width: 6px;
      cursor: col-resize;
      background: transparent;
      transition: background 0.16s ease;
    }
    .resize-handle:hover { background: var(--accent-soft); }
    .toolbar-action {
      min-width: 76px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid oklch(78% 0.03 250);
      background: var(--surface);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 20px -16px rgba(0,0,0,.35);
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .toolbar-action:hover {
      background: oklch(98% 0.004 250);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .toolbar-action.compact {
      min-width: 46px;
      width: 46px;
      padding: 0;
    }
    .rail-toggle {
      min-width: 34px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .16s ease, border-color .16s ease, background .16s ease;
    }
    .rail-toggle:hover { color: var(--fg); border-color: oklch(78% 0.03 250); background: oklch(98% 0.004 250); }
    .mid-rail-toggle {
      position: absolute;
      top: 50%;
      right: -16px;
      transform: translateY(-50%);
      width: 32px;
      height: 44px;
      min-width: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      box-shadow: 0 12px 28px -22px rgb(0 0 0 / 0.45);
      transition: color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .mid-rail-toggle:hover {
      color: var(--fg);
      border-color: var(--accent-border);
      background: var(--surface);
      transform: translateY(-50%) scale(1.03);
    }
    .vault-backdrop {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(18px) saturate(0.95);
      -webkit-backdrop-filter: blur(18px) saturate(0.95);
    }
    body[data-theme="dark"] .vault-backdrop {
      background: rgba(2, 6, 12, 0.58);
      backdrop-filter: blur(18px) saturate(0.86);
      -webkit-backdrop-filter: blur(18px) saturate(0.86);
    }
    .dependency-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, white, oklch(99% 0.002 240));
    }
    .pipeline-list {
      position: relative;
      display: grid;
      gap: 14px;
    }
    .pipeline-list::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      border-radius: 999px;
      background: var(--border);
      z-index: 1;
    }
    .pipeline-list.rail-collapsed::before {
      left: 50%;
      top: 18px;
      bottom: 18px;
      transform: translateX(-50%);
    }
    .pipeline-list.rail-collapsed .pipeline-list-progress {
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
    }
    .pipeline-list.rail-expanded {
      padding-left: 0;
    }
    .stage-row-card {
      min-width: 0;
    }
    .stage-row-card .stage-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage-row-card .stage-input {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pipeline-list-progress {
      position: absolute;
      left: 5px;
      top: 6px;
      width: 2px;
      height: var(--pipeline-progress, 0%);
      background: var(--accent);
      z-index: 2;
      border-radius: 999px;
      transition: height 0.3s ease;
    }
    .stage-summary-strip,
    .agent-choice-compact,
    .handoff-strip {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }
    .stage-file-button {
      min-height: 58px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
    }
    .stage-file-button:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .input-picker {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 45;
      width: min(520px, 88vw);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 60px -38px rgb(0 0 0 / 0.45);
      padding: 12px;
    }
    .input-picker-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 12px;
      background: var(--panel);
      margin-bottom: 12px;
    }
    .input-picker-tab {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      background: transparent;
    }
    .input-picker-tab.active {
      color: var(--fg);
      background: var(--surface);
      box-shadow: 0 8px 20px -18px rgb(0 0 0 / 0.45);
    }
    .input-file-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 12px;
      text-align: left;
      transition: border-color 0.16s ease, background 0.16s ease;
    }
    .input-file-row:hover,
    .input-file-row.selected {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .choice-pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 750;
      background: var(--surface);
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }
    .choice-pill.selected {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .workspace-assistant {
      width: 680px;
      min-width: 480px;
      max-width: 920px;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .page-assistant {
      width: 680px;
      min-width: 480px;
      max-width: 1080px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    .page-shell {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      width: auto;
    }
    .page-content {
      flex: 1 1 auto;
      min-width: 0;
    }
    .validity-workspace {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
      gap: 0;
      min-width: 920px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      min-height: calc(100vh - 260px);
    }
    .validity-workspace.no-ai {
      grid-template-columns: minmax(460px, 1fr) minmax(460px, 1fr);
      min-width: 920px;
    }
    .validity-panel {
      min-width: 0;
      min-height: calc(100vh - 66px);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }
    .validity-panel:last-child {
      border-right: 0;
    }
    .validity-panel.ai {
      background: color-mix(in oklch, var(--surface) 92%, var(--bg));
    }
    .validity-bottom-ai {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      overflow: hidden;
      min-height: 300px;
      box-shadow: 0 18px 50px -42px rgb(0 0 0 / .35);
    }
    .validity-bottom-ai .assistant-panel {
      height: 300px;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .validity-panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px;
      background: var(--panel);
    }
    .validity-doc-page {
      height: 760px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .validity-doc-spacer {
      flex: 1;
      min-height: 24px;
    }
    .pipeline-list.rail-collapsed {
      gap: 10px;
    }
    .pipeline-list.rail-collapsed .rail-stage-button {
      flex-shrink: 0;
    }
    .rail-stage-button {
      background: var(--surface) !important;
      color: var(--fg) !important;
      border-color: var(--border) !important;
    }
    .rail-stage-button.rail-stage-current {
      background: var(--surface) !important;
      color: var(--fg) !important;
      border-color: var(--border) !important;
      box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent);
    }
    .rail-stage-button.rail-stage-locked {
      color: var(--muted) !important;
    }
    body[data-theme="dark"] .chat-bubble {
      background: oklch(28% 0.012 250) !important;
      border-color: oklch(36% 0.014 250);
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.2);
    }
    .assistant-resize-handle {
      width: 14px;
      cursor: col-resize;
      background: transparent;
      border: 0;
      flex: 0 0 auto;
      padding: 0;
      appearance: none;
    }
    .assistant-resize-handle::after {
      content: none;
    }
    .workspace-assistant .assistant-resize-handle {
      position: absolute;
      left: -7px;
      top: 0;
      bottom: 0;
      z-index: 2;
    }
    .page-assistant .assistant-resize-handle {
      position: absolute;
      left: -7px;
      top: 0;
      bottom: 0;
      z-index: 2;
    }
    .profile-row {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .accent-swatch {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: inset 0 0 0 4px rgb(255 255 255 / .52);
    }
    .analytics-board {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 24px 70px -54px rgb(0 0 0 / .28);
    }
    body[data-theme="dark"] .analytics-board { box-shadow: 0 30px 90px -60px rgb(0 0 0 / .74); }
    .analytics-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      min-height: 118px;
      transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .analytics-card:hover {
      border-color: var(--accent-border);
      transform: translateY(-1px);
      box-shadow: 0 18px 44px -36px rgb(0 0 0 / .34);
    }
    .analytics-label {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .analytics-muted { color: var(--muted); }
    .analytics-value {
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    .analytics-chart {
      height: 178px;
      display: grid;
      grid-template-columns: repeat(12, minmax(26px, 1fr));
      align-items: end;
      gap: 18px;
      padding: 14px 32px 0;
    }
    .analytics-month {
      display: grid;
      justify-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .analytics-bar {
      width: 26px;
      height: 2px;
      border-radius: 999px;
      background: var(--soft);
    }
    .analytics-bar.win { height: 6px; background: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
    .wins-chart {
      position: relative;
      min-height: 260px;
      border-radius: 16px;
      background:
        linear-gradient(to top, var(--border) 1px, transparent 1px) 0 0 / 100% 25%,
        linear-gradient(to right, var(--border) 1px, transparent 1px) 0 0 / 8.333% 100%;
      padding: 30px 20px 18px;
      overflow: hidden;
    }
    .wins-chart::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 74px;
      height: 2px;
      background: var(--border);
    }
    .wins-bars {
      position: relative;
      z-index: 1;
      height: 190px;
      display: grid;
      grid-template-columns: repeat(12, minmax(28px, 1fr));
      align-items: end;
      gap: 14px;
    }
    .wins-bar-wrap {
      display: grid;
      justify-items: center;
      gap: 10px;
      min-width: 0;
    }
    .wins-bar {
      width: 100%;
      max-width: 34px;
      min-height: 8px;
      border-radius: 999px 999px 8px 8px;
      background: color-mix(in oklch, var(--fg) 13%, transparent);
      border: 1px solid var(--border);
      transition: background .16s ease, transform .16s ease, border-color .16s ease;
    }
    .wins-bar-wrap:hover .wins-bar {
      transform: translateY(-4px);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .wins-bar.current {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      display: inline-block;
      flex: 0 0 auto;
    }
    .donut {
      width: 126px;
      height: 126px;
      border-radius: 999px;
      background: conic-gradient(var(--accent) 0 42%, var(--accent-border) 42% 69%, color-mix(in oklch, var(--accent) 24%, var(--muted)) 69% 100%);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      position: relative;
    }
    .donut::before {
      content: "";
      width: 82px;
      height: 82px;
      border-radius: 999px;
      background: var(--surface);
      position: absolute;
    }
    .donut-content { position: relative; text-align: center; z-index: 1; }
    .result-row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .field-progress {
      height: 8px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }
    .field-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      width: 0%;
    }
    .asset-canvas {
      position: relative;
      min-height: 360px;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 18%, var(--accent-soft), transparent 30%),
        linear-gradient(155deg, var(--surface), var(--panel));
    }
    .twibbon-frame {
      position: absolute;
      inset: 28px;
      border: 18px solid var(--accent-soft);
      border-radius: 30px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .72);
    }
    .user-photo-dummy {
      position: absolute;
      left: 32%;
      top: 23%;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 999px;
      background: linear-gradient(145deg, oklch(88% .012 250), oklch(72% .025 250));
      border: 1px solid var(--border);
      box-shadow: 0 22px 48px -30px rgb(0 0 0 / .45);
    }
    .assistant-control {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: 10px;
      padding: 7px 9px;

    function useDragWidth(initial, min, max, direction = 1) {
      const [width, setWidth] = useState(initial);
      const startDrag = (event) => {
        event.preventDefault();
        const startX = event.clientX;
        const startWidth = width;
        const onMove = (moveEvent) => {
          const next = Math.min(max, Math.max(min, startWidth + direction * (moveEvent.clientX - startX)));
          setWidth(next);
        };
        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      };
      return [width, startDrag];
    }

                    <div className="donut-content">
                      <p className="text-2xl font-black">42%</p>
                      <p className="analytics-muted text-[10px] font-bold uppercase tracking-widest">Wins</p>
                    </div>
                  </div>
                  <div className="space-y-3 w-full">
                    {[["Wins", "42%", "var(--accent)"], ["Runner-up", "27%", "var(--accent-border)"], ["Finalist", "31%", "color-mix(in oklch, var(--accent) 24%, var(--muted))"]].map(([label, value, color]) => (
                      <div key={label} className="flex items-center justify-between gap-4 text-sm">
                        <span className="flex items-center gap-2 analytics-muted"><span className="legend-dot" style={{ background: color }}></span>{label}</span>
                        <span className="font-black">{value}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </div>

            <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 mt-6">
              <section className="analytics-card">
                <p className="analytics-label mb-5">Breakdown</p>
                <h2 className="text-xl font-black mb-6">Strongest Fields</h2>
                <div className="space-y-5">
                  {fields.map(([field, value]) => (
                    <div key={field}>
                      <div className="flex items-center justify-between mb-2 text-sm">
                        <span className="font-bold">{field}</span>
                        <span className="analytics-muted font-bold">{value}%</span>
                      </div>
                      <div className="field-progress"><span style={{ width: `${value}%` }}></span></div>
                    </div>
                  ))}
                </div>
              </section>
              <section className="analytics-card">
                <p className="analytics-label mb-5">Guidance</p>
                <h2 className="text-xl font-black mb-6">Suggestions to Improve</h2>
                <div className="min-h-[168px] rounded-2xl border border-[var(--border)] bg-[var(--panel)] grid place-items-center text-center p-8">
                  <div>
                    <div className="w-11 h-11 rounded-full bg-[var(--accent-soft)] text-[var(--accent)] mx-auto mb-4 grid place-items-center">
                      <Icon name="sparkles" size={20} />
                    </div>
                    <p className="font-black">No urgent suggestion</p>
                    <p className="analytics-muted text-sm mt-2 max-w-sm">Keep logging results to reveal stronger patterns.</p>
                  </div>
                </div>
              </section>
            </div>

            <section className="analytics-card mt-6">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
                <div>
                  <p className="analytics-label mb-2">Activity log</p>
                  <h2 className="text-xl font-black">Log Competition Results</h2>
                </div>
                <button className="btn-primary px-4 py-2 text-xs">Add Result</button>
              </div>
              <div className="space-y-3">
                {logs.map(([badge, title, date, status]) => (
                  <div key={title} className="result-row hover:border-[var(--accent-border)] transition-colors">
                    <div className="flex items-center gap-4 min-w-0">
                      <span className="status-chip ready shrink-0">{badge}</span>
                      <div className="min-w-0">
                        <p className="font-bold text-sm truncate">{title}</p>
                        <p className="analytics-muted text-xs mt-1">{date}</p>
                      </div>
                    </div>
                    <select defaultValue={status} className="min-w-[130px] rounded-lg border border-[var(--border)] bg-[var(--surface)] px-3 py-2 text-xs font-bold outline-none">
                      <option>Winner</option>
                      <option>Runner-up</option>
                      <option>Finalist</option>
                      <option>Submitted</option>
                    </select>
                  </div>
                ))}
              </div>
            </section>
          </div>
        </div>
      );
    }

    function ProfileScreen({ darkMode, setDarkMode }) {
      const [showDashboard, setShowDashboard] = useState(false);
      const [selectedAccent, setSelectedAccent] = useState(() => localStorage.getItem("esai-accent") || "Emerald");
      const processNotifications = [
        ["Style profile generated", "00_style_profile.md is ready for Main Agent Onboarding.", "Ready"],
        ["Research locked", "Research will open after Ideation output is approved.", "Guardrail"],
        ["Calendar synced", "PIMNAS deadline and review checkpoints were added.", "Synced"]
      ];
      if (showDashboard) return <AcademicAnalyticsDashboard onBack={() => setShowDashboard(false)} />;

      return (
        <div className="animate-in max-w-7xl">
          <header className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 mb-8">
            <div>
              <p className="text-xs font-bold uppercase tracking-[0.18em] text-emerald-600 mb-2">User Workspace</p>
              <h1 className="text-3xl font-bold">Analytical Board</h1>
              <p className="text-[#666] mt-2 max-w-2xl">A compact control center for progress, process notifications, theme preferences, and website look.</p>
            </div>
            <ThemeButton darkMode={darkMode} setDarkMode={setDarkMode} />
          </header>

          <div className="grid grid-cols-1 xl:grid-cols-[1.1fr_0.9fr] gap-6">
            <section className="card p-6">
              <div className="flex items-center justify-between gap-4 mb-5">
                <div>
                  <h2 className="text-xl font-bold">Process Notifications</h2>
                  <p className="text-sm text-[#666] mt-1">Important state changes from agents, vault files, and calendar sync.</p>
                </div>
                <span className="status-chip ready">Live</span>
              </div>
              <div className="space-y-3">
                {processNotifications.map(([title, desc, state]) => (
                  <div key={title} className="profile-row">
                    <div className="flex items-start gap-3 min-w-0">
                      <div className="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><Icon name="bell" size={16} /></div>
                      <div className="min-w-0">
                        <p className="font-bold text-sm">{title}</p>
                        <p className="text-xs text-[#777] mt-1">{desc}</p>
                      </div>
                    </div>
                    <span className={`status-chip ${state === "Ready" || state === "Synced" ? "ready" : ""}`}>{state}</span>
                  </div>
                ))}
              </div>
            </section>

            <section className="card p-6">
              <div className="flex items-center justify-between gap-4 mb-5">
                <div>
                  <h2 className="text-xl font-bold">Website Look</h2>
                  <p className="text-sm text-[#666] mt-1">Change the accent used across buttons, chips, progress, cards, and agent states.</p>
                </div>
                <Icon name="palette" size={20} className="text-[#999]" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {ACCENT_STYLES.map((accent) => (
                  <button
                    key={accent.name}
                    onClick={() => {
                      setSelectedAccent(accent.name);
                      applyAccentTheme(accent);
                    }}
                    className="profile-row"
                    style={selectedAccent === accent.name ? { borderColor: "var(--accent-border)", background: "var(--accent-soft)" } : null}
                  >
                    <span className="flex items-center gap-3"><span className="accent-swatch" style={{ background: accent.color }}></span><span className="font-bold text-sm">{accent.name}</span></span>
                    {selectedAccent === accent.name && <Icon name="check" size={16} className="text-emerald-600" />}
                  </button>
                ))}
              </div>
            </section>
          </div>

          <section className="card p-6 mt-6">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-5">
              <div>
                <h2 className="text-xl font-bold">Analytical Dashboard</h2>
                <p className="text-sm text-[#666] mt-1 max-w-xl">Open a separate high-level workflow dashboard. No competition-result log, no dense text.</p>
              </div>
              <button onClick={() => setShowDashboard(true)} className="btn-primary px-5 py-3 flex items-center gap-2 w-fit">
                Open Dashboard <Icon name="arrow-right" size={16} />
              </button>
            </div>
          </section>
        </div>
      );
    }

    function App() {
      const [activeScreen, setActiveScreen] = useState("dashboard");
      const [competitions, setCompetitions] = useState(DATA);
      const [selectedComp, setSelectedComp] = useState(null);
      const [showWizard, setShowWizard] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [sidebarWidth, resizeSidebar] = useDragWidth(256, 220, 360);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem("esai-theme") === "dark");
      const [assistantOpen, setAssistantOpen] = useState(false);
      const [assistantContext, setAssistantContext] = useState("Dashboard overview. The assistant can answer using current page, selected competition, vault files, stage dependencies, and output editor state.");
      const [pageAssistantWidth, resizePageAssistant] = useDragWidth(620, 440, 920, -1);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      useEffect(() => {
        const savedAccent = localStorage.getItem("esai-accent") || "Emerald";
        applyAccentTheme(ACCENT_STYLES.find((accent) => accent.name === savedAccent) || ACCENT_STYLES[0]);
      }, []);
      useEffect(() => {
        document.body.dataset.theme = darkMode ? "dark" : "light";
        localStorage.setItem("esai-theme", darkMode ? "dark" : "light");
        if (window.lucide) window.lucide.createIcons();
      }, [darkMode]);
      useEffect(() => {
        const competitionText = selectedComp ? ` Selected competition: ${selectedComp.title}, current stage ${selectedComp.currentStage}.` : "";
        setAssistantContext(`User is currently on ${activeScreen}.${competitionText} Assistant can use page context, vault files, dependencies, calendar deadlines, and visible output panels.`);
      }, [activeScreen, selectedComp]);

      const selectCompetition = (comp) => {
        setSelectedComp(comp);
        setActiveScreen("workbench");
      };
      const finishWizard = () => {
        setCompetitions([...competitions, { id: String(competitions.length + 1), title: "LKTIN UI 2026", category: "Sosial & Humaniora", university: "UI", status: "Setup", progress: 0, deadline: "2026-09-01", currentStage: "onboarding", posterTone: "new brief" }]);
        setShowWizard(false);
      };

      const mainOffset = sidebarCollapsed ? 76 : sidebarWidth;

      return (
        <div className="min-h-screen">
          <Sidebar activeScreen={activeScreen} setActiveScreen={setActiveScreen} collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed} width={sidebarWidth} onResize={resizeSidebar} assistantOpen={assistantOpen} setAssistantOpen={setAssistantOpen} setAssistantContext={setAssistantContext} darkMode={darkMode} setDarkMode={setDarkMode} />
          <div className="page-shell" style={{ marginLeft: mainOffset }}>
            <main className={`page-content min-h-screen p-8 ${activeScreen === "workbench" || assistantOpen ? "" : "max-w-7xl"}`}>
              {activeScreen === "dashboard" && <Dashboard competitions={competitions} onAdd={() => setShowWizard(true)} onSelect={selectCompetition} />}
              {activeScreen === "calendar" && <CalendarScreen competitions={competitions} />}
              {activeScreen === "validity" && <ValidityCheckerScreen assistantOpen={assistantOpen} assistantContext={assistantContext} setAssistantOpen={setAssistantOpen} setAssistantContext={setAssistantContext} />}
              {activeScreen === "outputs" && <Outputs competitions={competitions} />}
              {activeScreen === "workbench" && selectedComp && <Workbench competition={selectedComp} onBack={() => setActiveScreen("dashboard")} darkMode={darkMode} setDarkMode={setDarkMode} assistantOpen={assistantOpen} setAssistantOpen={setAssistantOpen} setAssistantContext={setAssistantContext} />}
              {activeScreen === "devs" && <DevsScreen />}
              {activeScreen === "profile" && <ProfileScreen darkMode={darkMode} setDarkMode={setDarkMode} />}
            </main>
            {assistantOpen && activeScreen !== "workbench" && activeScreen !== "validity" && (
              <aside className="page-assistant animate-in" style={{ width: pageAssistantWidth }}>
                <button aria-label="Resize AI assistant" onMouseDown={resizePageAssistant} className="assistant-resize-handle"></button>
                <AssistantPanel setOpen={setAssistantOpen} context={assistantContext} />
              </aside>
            )}
          </div>
          {showWizard && <Wizard onCancel={() => setShowWizard(false)} onFinish={finishWizard} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
